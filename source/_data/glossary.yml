# 术语表：文章正文里第一次出现这些词时，加上虚线下划线，悬停（手机上点一下）显示一句解释和「详细讲解」的链接。
# 生成逻辑见 themes/lucky-term/scripts/glossary.js。
#
#   term   在正文中匹配的写法（区分大小写；英文词前后不能紧挨着字母数字，所以 DTS 不会匹配 ADTS）
#   alias  其他写法，可选
#   en     英文全称，可选，显示在卡片标题旁
#   desc   一两句话的解释，写清楚「是什么、为什么重要」，不超过 80 字左右
#   post   详细讲解它的文章（_posts 下的文件名，不带 .md）；在这篇文章里不加标记
#
# 只收在多篇文章里反复出现、读者可能跳着读时不认识的词。太常见的（线程、进程、模板、索引）不收；
# 一词多义的（滑动窗口：TCP 流量控制 / 双指针算法；CAP：分布式定理 / Linux capabilities）也不收。

# ---------- C/C++ ----------
- term: 未定义行为
  en: undefined behavior
  desc: C/C++ 标准没有规定结果的操作，比如数组越界、有符号整数溢出、解引用空指针。程序可能看似正常、可能崩溃，开了优化后还可能被编译器改得面目全非。
  post: c-data-types
- term: 悬空指针
  en: dangling pointer
  desc: 指向的内存已经被释放或已经失效（比如函数返回后的局部变量）的指针。它的值看起来没问题，但读写的是不再属于你的内存。
  post: c-pointer-basics
- term: 内存泄漏
  en: memory leak
  desc: 动态分配的内存用完后没有释放，而且已经没有指针指向它，再也释放不了。长时间运行的程序会因此越占越多内存。
  post: c-dynamic-memory
- term: RAII
  en: Resource Acquisition Is Initialization
  desc: C++ 管理资源的惯用法：在构造函数里获取资源（内存、文件、锁），在析构函数里释放。对象离开作用域时自动析构，即使中途抛出异常也不会漏掉释放。
  post: cppbasic-constructors
- term: 智能指针
  en: smart pointer
  desc: 用 RAII 管理堆内存的类模板：unique_ptr 独占所有权，shared_ptr 用引用计数共享所有权，weak_ptr 只观察不持有。不用再手动 delete。
  post: cpp11-smart-pointers
- term: 移动语义
  en: move semantics
  desc: C++11 引入：对象的资源（比如一块堆内存）可以直接「转交」给另一个对象，而不是复制一份。靠右值引用和移动构造 / 移动赋值实现。
  post: cpp11-move-semantics
- term: 虚函数
  en: virtual function
  desc: 用 virtual 声明的成员函数。通过基类指针或引用调用时，运行时根据对象的实际类型决定调用哪个版本，这是 C++ 实现多态的方式，背后通常是虚函数表。
  post: cppbasic-polymorphism
- term: 迭代器
  en: iterator
  desc: 用统一的方式遍历容器的对象，用法像指针：*it 取元素，++it 到下一个。STL 算法只和迭代器打交道，所以同一个算法能用在不同的容器上。
  post: cppbasic-iterators-algorithms

# ---------- 设计模式 ----------
# 每写好一个模式的文章，就把模式名加进来（post 指向那篇文章）
- term: 设计模式
  en: design pattern
  desc: 针对常见设计问题、被反复验证过的解决方案，比如策略、观察者、工厂。核心是把会变化的部分隔离开，让新需求只需要新增代码；模式名也是团队之间的共同词汇。
  post: dp-why-design-patterns
- term: GoF
  en: Gang of Four
  desc: 1994 年出版《设计模式》一书的四位作者（Gamma、Helm、Johnson、Vlissides）。书中的 23 种模式称为 GoF 模式，分为创建型、结构型、行为型三类。
  post: dp-why-design-patterns
- term: SOLID
  desc: 五条面向对象设计原则的缩写：单一职责、开闭、里氏替换、接口隔离、依赖倒置。由 Robert C. Martin 整理，是理解设计模式「为什么这样设计」的基础。
  post: dp-solid-srp-ocp
- term: 单一职责原则
  alias: [单一职责]
  en: Single Responsibility Principle
  desc: 一个模块只对一类角色负责，也就是只有一类人会要求修改它。判断方法是问「谁会要求改这段代码」，而不是数它有几个函数。
  post: dp-solid-srp-ocp
- term: 开闭原则
  en: Open/Closed Principle
  desc: 软件实体应该对扩展开放、对修改关闭：加新功能时新增代码，而不是修改已经写好、测试过的代码。做法是在会变化的方向上留出扩展点，比如抽象类、std::function、插件。
  post: dp-solid-srp-ocp
- term: 里氏替换原则
  alias: [里氏替换]
  en: Liskov Substitution Principle
  desc: 凡是使用父类的地方，换成任何子类都应该照样正确。决定能否继承的不是「is-a」，而是行为契约：前置条件不能加强、后置条件不能削弱、不变式必须保持。
  post: dp-solid-lsp-isp-dip
- term: 接口隔离原则
  alias: [接口隔离]
  en: Interface Segregation Principle
  desc: 不应该强迫使用者依赖它用不到的方法。接口按使用者的角色拆小，否则实现类会出现「不支持」的空函数，改一个函数还会牵连所有包含这个接口的源文件重新编译。
  post: dp-solid-lsp-isp-dip
- term: 依赖倒置原则
  alias: [依赖倒置]
  en: Dependency Inversion Principle
  desc: 高层业务和低层细节都依赖抽象，并且抽象由高层定义。运行时仍然是业务调用存储、网络等细节，但源码依赖的方向倒了过来，业务代码可以脱离这些细节测试和替换。
  post: dp-solid-lsp-isp-dip
- term: 依赖注入
  en: dependency injection
  desc: 对象需要的依赖从外面传进来（比如通过构造函数参数），而不是自己在内部创建。测试时可以传入假的实现，是实现依赖倒置最常用的方式。
  post: dp-solid-lsp-isp-dip
- term: 脆弱基类
  en: fragile base class
  desc: 子类依赖了基类没有承诺的实现细节（比如基类的一个函数内部调用了另一个虚函数），基类在不改接口的情况下修改内部实现，子类的行为就悄悄变了。是「组合优于继承」的主要理由之一。
  post: dp-composition-over-inheritance
- term: 分支预测
  en: branch prediction
  desc: CPU 遇到条件跳转、switch 或虚函数调用时，不等结果算出来就先猜一个方向继续执行，猜错了再丢掉重来，每次要损失十几个时钟周期。数据的规律越明显，猜得越准。
  post: dp-composition-over-inheritance
- term: 单例模式
  alias: [单例]
  en: Singleton
  desc: 保证一个类只有一个实例，并提供全局访问点。C++11 起推荐用局部静态变量实现（Meyers 单例），线程安全且第一次使用时才构造；但它本质上是全局变量，会隐藏依赖、让测试互相干扰。
  post: dp-singleton
- term: 静态初始化顺序问题
  en: static initialization order fiasco
  desc: 不同源文件里的全局对象，初始化的先后顺序没有规定（实际取决于链接顺序）。一个全局对象的构造函数如果用到另一个源文件里的全局对象，可能读到还没初始化的值。
  post: dp-singleton
- term: 工厂方法模式
  alias: [工厂方法]
  en: Factory Method
  desc: 框架定好流程，把「创建哪种对象」交给一个虚函数，由子类重写它来决定。常用来让框架不依赖具体产品，也常用来给测试留出替换对象的接缝。
  post: dp-factory-method
- term: 简单工厂
  en: simple factory
  desc: 用一个函数按名字或类型码创建对象，调用者只拿到接口。不是 GoF 模式，但很常用；加新类型时要修改这个函数，但修改集中在一处。
  post: dp-factory-method
- term: 抽象工厂模式
  alias: [抽象工厂]
  en: Abstract Factory
  desc: 用一个工厂接口创建一整族相互配套的对象（比如同一种硬件加速的解码器和渲染器），每个族一个具体工厂。产品都出自同一个工厂，就不会混用；代价是加一种新产品要改所有工厂。
  post: dp-abstract-factory
- term: 建造者模式
  alias: [建造者]
  en: Builder
  desc: 用一个专门的建造者对象一步步收集参数（常写成链式调用），最后在 build() 里统一检查并创建完整的产品。适合参数多、有默认值、参数之间有约束的对象。
  post: dp-builder
- term: 散弹式修改
  en: shotgun surgery
  desc: 一个需求要在很多地方各改一点，比如每加一种格式，就要把散落在各处的 if-else 全部找出来加一个分支。改的地方越多越容易漏，漏掉的那处编译器往往发现不了。
  post: dp-why-design-patterns
- term: UML
  en: Unified Modeling Language
  desc: 统一建模语言，一套画软件结构的标准图形符号。日常最常用的是描述类之间关系的类图，和描述调用顺序的时序图。
  post: dp-uml-class-diagram
- term: 类图
  en: class diagram
  desc: 用方框表示类、用不同的连线表示类之间关系的图：三角是继承和实现，菱形是组合和聚合，虚线箭头是依赖。设计模式的结构几乎都用它来表达。
  post: dp-uml-class-diagram

# ---------- 数据结构与算法 ----------
- term: 时间复杂度
  en: time complexity
  desc: 描述算法的运行时间随输入规模 n 增长的趋势，用大 O 记号表示，只看最高阶、忽略常数，比如 O(n)、O(n log n)、O(n²)。
  post: ds-complexity
- term: 哈希表
  en: hash table
  desc: 用哈希函数把键算成数组下标，平均 O(1) 完成查找、插入和删除。不同的键算出同一个下标叫冲突，常用链地址法或开放寻址法解决。
  post: ds-hash-table
- term: 二叉搜索树
  en: binary search tree
  desc: 每个结点的左子树都比它小、右子树都比它大的二叉树，中序遍历就是有序序列。查找沿一条路径往下走，耗时取决于树高，退化成链表时变成 O(n)。
  post: ds-bst
- term: 红黑树
  en: red-black tree
  desc: 一种自平衡二叉搜索树：给结点染红黑两色并约束颜色规则，保证最长路径不超过最短路径的两倍，增删查都是 O(log n)。std::map 通常用它实现。
  post: ds-rbtree
- term: 跳表
  en: skip list
  desc: 在有序链表上随机地加几层「快速通道」索引，查找时从最高层往下跳，平均 O(log n)。比平衡树好写，Redis 的有序集合和很多 LSM 存储引擎的内存表都用它。
  post: ds-skiplist
- term: 布隆过滤器
  en: Bloom filter
  desc: 用一个位数组和多个哈希函数判断「元素在不在集合里」：说不在就一定不在，说在则可能误判。空间极小，常用来在查磁盘或数据库前先挡掉肯定不存在的键。
  post: db-lsm-bloom
- term: 动态规划
  en: dynamic programming
  desc: 把问题拆成重叠的子问题，每个子问题只算一次并记下结果，再由小问题的答案推出大问题的答案。关键是定义状态和写出状态转移方程。
  post: algo-dp-basics

# ---------- Linux ----------
- term: 系统调用
  en: system call
  desc: 用户程序请求内核办事的入口，比如 read、write、open、fork。调用时 CPU 从用户态切换到内核态，开销比普通函数调用大得多。
  post: lx-fd-syscalls
- term: 文件描述符
  en: file descriptor, fd
  desc: 进程打开文件、socket、管道等之后，内核返回的一个小整数，之后的读写都通过它进行。0、1、2 默认是标准输入、标准输出和标准错误。
  post: lx-fd-syscalls
- term: 页缓存
  en: page cache
  desc: 内核用空闲内存缓存的文件内容。read 先查页缓存，write 通常只写进页缓存就返回，之后由内核刷到磁盘，所以写入快、断电可能丢数据（除非 fsync）。
  post: lx-page-cache
- term: 虚拟内存
  en: virtual memory
  desc: 每个进程看到的都是一片独立、连续的地址空间，由 CPU 的 MMU 按页表映射到物理内存。进程之间因此互相隔离，也可以只在真正用到时才分配物理内存。
  post: lx-virtual-memory
- term: 缺页
  alias: [缺页异常, 缺页中断]
  en: page fault
  desc: 访问的虚拟地址还没有映射到物理内存时，CPU 触发的异常。内核处理它：分配物理页、从磁盘读入或做写时复制，然后让程序继续执行。
  post: lx-virtual-memory
- term: 互斥锁
  en: mutex
  desc: 保证同一时刻只有一个线程进入临界区的锁：加锁成功的线程执行，其他线程阻塞等待，解锁后再有一个线程能进入。
  post: lx-pthreads
- term: 条件变量
  en: condition variable
  desc: 让线程「等到某个条件成立再继续」的同步工具，和互斥锁配合使用：条件不满足就 wait 睡眠，别的线程改了条件后 signal / broadcast 唤醒它。
  post: lx-thread-sync
- term: 死锁
  en: deadlock
  desc: 两个或多个线程（或事务）各自持有对方需要的锁，又都在等对方释放，结果谁也无法继续。常见的预防方法是所有人按同样的顺序加锁。
  post: lx-thread-sync

# ---------- 计算机网络与服务器 ----------
- term: 三次握手
  en: three-way handshake
  desc: 建立 TCP 连接的过程：客户端发 SYN，服务器回 SYN+ACK，客户端再回 ACK。双方借此确认对方能收发，并交换各自的初始序号。
  post: tcp-handshake
- term: 四次挥手
  desc: 关闭 TCP 连接的过程：TCP 是全双工的，两个方向要分别关闭，每个方向各发一次 FIN、对方回一次 ACK。被动关闭方的 ACK 和 FIN 常常合成一个包，所以抓包时经常只看到 3 个。
  post: tcp-handshake
- term: TIME_WAIT
  desc: 主动关闭 TCP 连接的一方发出最后一个 ACK 后进入的状态，要等 2MSL（Linux 上是 60 秒）才真正释放，防止旧连接的迟到报文干扰新连接。
  post: tcp-handshake
- term: 拥塞控制
  en: congestion control
  desc: TCP 根据丢包或延迟估计网络的拥堵程度，动态调整发送速度（拥塞窗口），避免把网络塞满。常见算法有 Reno、CUBIC、BBR。
  post: net-tcp-congestion
- term: MTU
  en: Maximum Transmission Unit
  desc: 一条链路一次能传输的最大 IP 包长度，以太网通常是 1500 字节。超过 MTU 的包要分片，或者被丢弃并通过 ICMP 通知发送方。
  post: net-mtu
- term: MSS
  en: Maximum Segment Size
  desc: TCP 报文段里数据部分的最大长度，在三次握手时协商。以太网上一般是 MTU 1500 减去 IP 头和 TCP 头各 20 字节，即 1460。
  post: net-mtu
- term: NAT
  en: Network Address Translation
  desc: 网络地址转换：路由器把内网主机发出的包的源地址改成自己的公网地址，并记下对应关系，回复到达时再改回去。家里所有设备因此能共用一个公网 IP。
  post: net-ip-subnet
- term: 字节序
  en: byte order, endianness
  desc: 多字节整数在内存中的存放顺序：小端把低位字节放在低地址（x86、ARM 通常如此），大端反之。网络协议统一用大端，所以要用 htons、htonl 等函数转换。
  post: net-socket-tcp
- term: 粘包
  desc: TCP 是字节流，没有消息边界：发送方的两次 send 可能被接收方一次 recv 读到，一次 send 也可能分几次才读完。应用层要自己定边界，比如长度前缀或分隔符。
  post: net-tcp-pitfalls
- term: epoll
  desc: Linux 的 I/O 多路复用接口：把要关注的 fd 注册进内核，epoll_wait 只返回已经就绪的那些。连接再多也不用每次全部扫一遍，是高并发服务器的基础。
  post: net-epoll
- term: Reactor
  desc: 一种事件驱动的服务器结构：一个循环等待 I/O 事件（比如用 epoll），事件来了就分发给注册好的回调函数处理。固定的循环写一次，变化的只是回调。
  post: srv-reactor

# ---------- 数据库 ----------
- term: B+ 树
  alias: [B+树]
  en: B+ tree
  desc: 多路平衡搜索树，所有数据都在叶子结点，叶子之间用链表串起来。树很矮（三四层就能存上千万行），磁盘 I/O 少，又适合范围查询，是 MySQL InnoDB 索引的结构。
  post: db-btree-index
- term: 回表
  desc: 在 InnoDB 中，二级索引的叶子只存索引列和主键。查询还需要别的列时，要拿主键再去聚簇索引里查一次整行，这一步叫回表。
  post: db-btree-index
- term: 覆盖索引
  en: covering index
  desc: 查询需要的所有列都包含在某个二级索引里，只读这个索引就能得到结果，不需要回表。EXPLAIN 的 Extra 列会显示 Using index。
  post: db-btree-index
- term: MVCC
  en: Multi-Version Concurrency Control
  desc: 多版本并发控制：一行数据保留多个版本，每个事务按自己的快照（read view）读到对应的版本。读不加锁，读写之间互不阻塞。
  post: db-isolation-mvcc
- term: binlog
  desc: MySQL Server 层的二进制日志，按顺序记录所有修改数据的操作，用于主从复制和按时间点恢复。它和 InnoDB 用于崩溃恢复的 redo log 是两套日志。
  post: db-logs-recovery
- term: WAL
  en: Write-Ahead Logging
  desc: 预写日志：修改数据之前先把这次修改追加写进日志并落盘。崩溃后重放日志就能恢复，数据页本身可以晚一些、批量地写回。
  post: db-lsm-wal
- term: LSM 树
  alias: [LSM]
  en: Log-Structured Merge tree
  desc: 写入先进内存表，攒满后整体顺序写成磁盘上有序的只读文件（SSTable），后台再把文件合并。随机写变成顺序写，所以写入很快，代价是读和合并的开销。
  post: db-lsm-wal

# ---------- 音视频 ----------
- term: YUV
  desc: 用亮度（Y）和两个色度分量（U、V）表示颜色的格式。人眼对色度不敏感，可以只存四分之一的色度（YUV 4:2:0），视频编码几乎都以它为输入。
  post: av-yuv
- term: 码率
  en: bitrate
  desc: 每秒的音视频数据量，单位一般是 kbps 或 Mbps。同样的编码器和分辨率下，码率越高画质越好、文件越大。
  post: av-why-compress
- term: GOP
  en: Group of Pictures
  desc: 从一个关键帧（I 帧）到下一个关键帧之间的一组帧。GOP 越长压缩率越高，但随机跳转和直播的首屏要等的时间也越长。
  post: av-why-compress
- term: 封装格式
  alias: [容器格式]
  en: container format
  desc: 把编码后的视频、音频、字幕和时间戳等信息按一定结构装进一个文件或数据流的格式，比如 MP4、FLV、MPEG-TS、MKV。它和编码格式（H.264、AAC）是两回事。
  post: av-inspect-file
- term: 时间基
  en: time base
  desc: 时间戳的单位，写成分数，比如 1/90000 秒。时间戳是整数，乘以时间基才是秒；不同封装格式的时间基不同，转换时要换算。
  post: av-inspect-file
- term: PTS
  en: Presentation Time Stamp
  desc: 显示时间戳：这一帧应该在什么时候显示。有 B 帧时解码顺序和显示顺序不同，所以 PTS 可能和 DTS 不相等。
  post: av-timestamps
- term: DTS
  en: Decoding Time Stamp
  desc: 解码时间戳：这一帧应该在什么时候送进解码器。B 帧要参考后面的帧，被参考的帧必须先解码，所以 DTS 顺序和 PTS 顺序可能不同。
  post: av-timestamps
- term: IDR
  en: Instantaneous Decoder Refresh
  desc: H.264 中的一种关键帧：解码器遇到它会清空参考帧，之后的帧不再参考它之前的任何帧，所以可以从 IDR 开始独立解码。
  post: av-h264-nalu
- term: SPS
  en: Sequence Parameter Set
  desc: H.264 的序列参数集，记录分辨率、档次（profile）、参考帧数等整个序列共用的参数。解码器必须先拿到 SPS 和 PPS 才能解码后面的画面。
  post: av-h264-nalu
- term: PPS
  en: Picture Parameter Set
  desc: H.264 的图像参数集，记录熵编码方式、量化参数初值等图像级的参数，通常紧跟在 SPS 后面。
  post: av-h264-nalu
- term: Annex B
  desc: H.264 码流的一种组织方式：每个 NALU 前面加起始码 00 00 01 或 00 00 00 01。MPEG-TS 和裸 .h264 文件用它；MP4、FLV 用的则是在前面写长度的 AVCC 格式。
  post: av-h264-nalu

# ---------- 分布式系统 ----------
- term: 脑裂
  en: split brain
  desc: 网络分区后，集群里同时出现两个都认为自己是主节点的节点，各自接受写入，数据因此分叉。常用多数投票和任期号来防止。
  post: dist-failover
- term: Raft
  desc: 一种容易理解的共识算法：节点通过多数投票选出领导者，所有写入由领导者按顺序复制到多数节点后才确认，从而在部分节点故障时仍保证数据一致。
  post: dist-failover
