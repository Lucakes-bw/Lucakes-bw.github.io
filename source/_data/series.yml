# 专栏配置
# key 对应专栏页 /column/<key>/ 中的 {% series <key> %}
#   category: 文章 front-matter 中 categories 的第一级
#   chapters: 第二级分类，按这里的顺序显示；章节内的文章按 front-matter 的 order 升序排列
#   lang / color: 首页专栏卡片上的「语言」标签和小圆点颜色（可选）
cpp:
  category: C/C++
  desc: 从 C 语言语法到现代 C++（C++11/14/17/20），每篇从零讲起，再深入到原理和进阶用法。
  lang: C++
  color: "#f34b7d"
  chapters:
    - C语言基础
    - C++基础
    - C++11
    - C++14
    - C++17
    - C++20

data-structure:
  category: 数据结构
  desc: 用 C/C++ 实现常见数据结构与算法，理解每一种结构的原理和适用场景。
  lang: C
  color: "#555555"
  chapters:
    - 线性表
    - 栈和队列
    - 树
    - 图
    - 排序与查找
    - 实战项目

network:
  category: 计算机网络
  desc: 从分层模型到 TCP/IP，再到 Socket 网络编程。
  lang: TCP/IP
  color: "#3178c6"
  chapters:
    - 网络模型
    - TCP/IP协议
    - 应用层协议
    - Socket编程

linux:
  category: Linux基础
  desc: 常用命令、开发工具链、文件 IO、进程与线程，Linux 下开发必备。
  lang: Shell
  color: "#89e051"
  chapters:
    - 常用命令
    - 开发工具
    - 文件IO
    - 进程与线程

mysql:
  category: 数据库
  desc: 以 MySQL 为例，从 SQL 到索引、事务与锁，再到备份、复制和调优，每个结论都在真实的数据库中实测。
  lang: SQL
  color: "#e38c00"
  chapters:
    - SQL基础
    - 数据库设计
    - 索引与查询优化
    - 事务与锁
    - 应用与运维

client:
  category: 客户端开发
  desc: 用 Qt 6 和 C++ 写桌面客户端，从信号槽、界面、事件循环和多线程，到网络与本地存储，最后做一个接上网络专栏服务器的聊天客户端。
  lang: Qt
  color: "#41cd52"
  chapters:
    - Qt入门
    - 界面开发
    - 事件与多线程
    - 网络与数据
    - 综合实战
