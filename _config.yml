# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: lucky 的编程笔记
subtitle: 'C/C++ · 数据结构 · Linux · 计算机网络 · 数据库'
description: '系统整理 C/C++、数据结构、Linux 基础、计算机网络、数据库的学习资料'
keywords: C语言, C++, 数据结构, 计算机网络, Linux, 数据库, MySQL
author: lucky
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://lucakes-bw.github.io
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 未分类
# 中文分类名 -> URL 中的英文路径
category_map:
  C/C++: cpp
  C语言基础: c-basic
  C++基础: cpp-basic
  C++11: cpp11
  C++14: cpp14
  C++17: cpp17
  C++20: cpp20
  数据结构: data-structure
  线性表: linear-list
  栈和队列: stack-queue
  树: tree
  图: graph
  排序与查找: sort-search
  计算机网络: network
  网络模型: network-model
  TCP/IP协议: tcp-ip
  应用层协议: application-layer
  Socket编程: socket
  Linux基础: linux
  常用命令: commands
  开发工具: dev-tools
  文件IO: file-io
  进程与线程: process-thread
  客户端开发: client
  Qt入门: qt-basics
  界面开发: qt-ui
  事件与多线程: qt-event-thread
  网络与数据: qt-network-data
  综合实战: qt-project
  未分类: uncategorized
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: lucky-term

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

# 本地搜索：索引 /search.json 由主题的 scripts/search.js 生成，不需要插件

# 归档 / 分类 / 标签页不分页
archive_generator:
  per_page: 0
  yearly: false
  monthly: false
  daily: false
category_generator:
  per_page: 0
tag_generator:
  per_page: 0
