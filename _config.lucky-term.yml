# lucky-term 主题配置

# 顶部导航：cmd 是显示在前面的「命令」，name 是名称
menu:
  - { cmd: cd, name: 专栏, path: /column/ }
  - { cmd: vim, name: 刷题, path: /problems/ }
  - { cmd: ls, name: 归档, path: /archives/ }
  - { cmd: tag, name: 标签, path: /tags/ }
  - { cmd: cat, name: 公告, path: /essay/ }

# 终端提示符 user@host
prompt:
  user: lucky
  host: notes

# 首页
hero:
  intro: 记录 C/C++、数据结构、计算机网络与 Linux 的学习笔记。按专栏顺序读，从语法一路走到网络编程。
  roadmap_title: 从零到 Linux 网络编程

# 配色方案（颜色定义在 themes/lucky-term/source/css/style.css 里）
# light / dark：访客没选过时，按系统深浅色用哪一个
# list：菜单里出现的方案和顺序；mode 决定评论区等跟随深色还是浅色；
#       ui: ios 表示除了颜色，排版和组件也换成 iOS 风格
schemes:
  light: default-light
  dark: default-dark
  list:
    - { id: ios-light, name: iOS Light, mode: light, ui: ios }
    - { id: ios-dark, name: iOS Dark, mode: dark, ui: ios }
    - { id: default-light, name: Default Light, mode: light }
    - { id: github-light, name: GitHub Light, mode: light }
    - { id: solarized-light, name: Solarized Light, mode: light }
    - { id: catppuccin-latte, name: Catppuccin Latte, mode: light }
    - { id: gruvbox-light, name: Gruvbox Light, mode: light }
    - { id: default-dark, name: Default Dark, mode: dark }
    - { id: one-dark, name: One Dark, mode: dark }
    - { id: dracula, name: Dracula, mode: dark }
    - { id: tokyo-night, name: Tokyo Night, mode: dark }
    - { id: catppuccin-mocha, name: Catppuccin Mocha, mode: dark }
    - { id: nord, name: Nord, mode: dark }
    - { id: gruvbox-dark, name: Gruvbox Dark, mode: dark }
    - { id: solarized-dark, name: Solarized Dark, mode: dark }
    - { id: monokai, name: Monokai, mode: dark }
    - { id: rose-pine, name: Rosé Pine, mode: dark }

favicon: /img/logo.svg
github: https://github.com/Lucakes-bw
since: 2026

# 不蒜子访问统计
busuanzi: true

